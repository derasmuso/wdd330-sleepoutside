<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Cart</title>
    <link rel="stylesheet" href="/css/style.css" />
    <script src="/js/cart.js" type="module"></script>
  </head>

  <body>
    <header class="divider" id="main-header"></header>

    <main class="divider">
      <section class="products">
        <h2>My Cart</h2>

        <!-- Cart Items Container -->
        <div id="cart-items">
          <!-- Cart items will be rendered here by JavaScript -->
        </div>

        <!-- Empty Cart Message (hidden by default) -->
        <div
          id="empty-cart-message"
          style="display: none; text-align: center; padding: 40px 0"
        >
          <p style="font-size: 1.2rem; color: #666">Your cart is empty.</p>
          <a
            href="/index.html"
            style="
              display: inline-block;
              margin-top: 10px;
              padding: 10px 20px;
              background: #2c7a4d;
              color: white;
              text-decoration: none;
              border-radius: 5px;
            "
            >Start Shopping</a
          >
        </div>

        <!-- Cart Total Section (hidden by default) -->
        <div
          class="cart-total-container"
          style="
            display: none;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #ddd;
          "
        >
          <div
            class="cart-total"
            style="
              display: flex;
              justify-content: flex-end;
              align-items: center;
              gap: 20px;
              font-size: 1.2rem;
            "
          >
            <span class="total-label" style="font-weight: bold; color: #333"
              >Total:</span
            >
            <span
              class="total-amount"
              id="cartTotal"
              style="font-size: 1.5rem; font-weight: bold; color: #2c7a4d"
              >$0.00</span
            >
          </div>
          <button
            class="checkout-btn"
            id="checkoutBtn"
            style="
              display: block;
              width: 100%;
              padding: 12px;
              margin-top: 10px;
              background: #2c7a4d;
              color: white;
              border: none;
              border-radius: 5px;
              font-size: 1.1rem;
              cursor: pointer;
              transition: background 0.3s;
            "
          >
            Proceed to Checkout
          </button>
        </div>
      </section>
    </main>

    <footer id="main-footer"></footer>
  </body>
</html>
