<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sleep Outside | Home</title>
  <link rel="stylesheet" href="/css/style.css" />
  <script src="/js/main.js" type="module"></script>
</head>

<body>
  <header class="divider" id="main-header"></header>

  <main class="divider">
    <div class="hero">
      <img
        src="/images/banner-sm.jpg"
        srcset="/images/banner-sm.jpg 500w, /images/banner.jpg 1000w"
        sizes="100vw"
        alt="image of a high mountain lake"
      />
      <div class="logo logo--square">
        <img src="/images/noun_Tent_2517.svg" alt="tent image for logo" />
        <div>Sleep<span class="highlight">Outside</span></div>
      </div>
      <div class="mission">
        <p>
          Our mission is to provide you with everything you need to sleep
          outside comfortably at an affordable price.
        </p>
      </div>
    </div>

    <!-- Breadcrumb intentionally omitted from the home page. -->

    <section class="categories-section">
      <h2>Categories</h2>

      <div class="categories-container">
        <a href="/product_listing/index.html?category=tents">
          <div class="category-card">
            <img src="/images/categories/category-tents.svg" alt="Tents" />
            <h3>Tents</h3>
          </div>
        </a>

        <a href="/product_listing/index.html?category=backpacks">
          <div class="category-card">
            <img src="/images/categories/category-backpacks.svg" alt="Backpacks" />
            <h3>Backpacks</h3>
          </div>
        </a>

        <a href="/product_listing/index.html?category=sleeping-bags">
          <div class="category-card">
            <img src="/images/categories/category-sleepingbags.svg" alt="Sleeping Bags" />
            <h3>Sleeping Bags</h3>
          </div>
        </a>

        <a href="/product_listing/index.html?category=hammocks">
          <div class="category-card">
            <img src="/images/categories/category-hammocks.svg" alt="Hammocks" />
            <h3>Hammocks</h3>
          </div>
        </a>
      </div>
    </section>

    <section class="newsletter">
      <h2>Subscribe to our Newsletter</h2>
      <p>Stay up to date with the latest news and offers from Sleep Outside.</p>
      <form id="newsletter-form" action="thank-you/newsletter.html" method="GET">
        <div class="form-group">
          <label for="fname">First Name:</label>
          <input type="text" id="fname" name="fname" required />
        </div>
        <div class="form-group">
          <label for="email">Email:</label>
          <input type="email" id="email" name="email" required />
        </div>
        <button type="submit">Subscribe</button>
      </form>
    </section>
  </main>

  <footer id="main-footer"></footer>
</body>
</html>
