<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Checkout</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>

  <body>
    <header class="divider" id="main-header"></header>

    <main class="divider">
      <section class="checkout">
        <h2>Checkout</h2>

        <form id="checkoutForm" class="checkout-form">
          <fieldset>
            <legend>Customer Information</legend>

            <div class="form-group">
              <label for="fname">First Name:</label>
              <input
                type="text"
                id="fname"
                name="fname"
                required
                minlength="2"
                placeholder="Enter first name"
              />
            </div>

            <div class="form-group">
              <label for="lname">Last Name:</label>
              <input
                type="text"
                id="lname"
                name="lname"
                required
                minlength="2"
                placeholder="Enter last name"
              />
            </div>

            <div class="form-group">
              <label for="email">Email:</label>
              <input
                type="email"
                id="email"
                name="email"
                required
                placeholder="Enter email address"
              />
            </div>

            <div class="form-group">
              <label for="phone">Phone:</label>
              <input
                type="tel"
                id="phone"
                name="phone"
                pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}"
                placeholder="123-456-7890"
                required
              />
              <small>Format: 123-456-7890</small>
            </div>
          </fieldset>

          <fieldset>
            <legend>Shipping Address</legend>

            <div class="form-group">
              <label for="address">Street Address:</label>
              <input
                type="text"
                id="address"
                name="address"
                required
                placeholder="Enter street address"
              />
            </div>

            <div class="form-group">
              <label for="city">City:</label>
              <input
                type="text"
                id="city"
                name="city"
                required
                placeholder="Enter city"
              />
            </div>

            <div class="form-group">
              <label for="state">State:</label>
              <input
                type="text"
                id="state"
                name="state"
                required
                maxlength="2"
                placeholder="UT"
              />
            </div>

            <div class="form-group">
              <label for="zip">ZIP Code:</label>
              <input
                type="text"
                id="zip"
                name="zip"
                required
                pattern="[0-9]{5}"
                placeholder="12345"
              />
            </div>
          </fieldset>

          <fieldset>
            <legend>Payment Information</legend>

            <div class="form-group">
              <label for="cardNumber">Card Number:</label>
              <input
                type="text"
                id="cardNumber"
                name="cardNumber"
                required
                pattern="[0-9]{16}"
                placeholder="1234567890123456"
              />
              <small>Enter 16 digits without spaces</small>
            </div>

            <div class="form-group">
              <label for="expDate">Expiration Date:</label>
              <input type="month" id="expDate" name="expDate" required />
            </div>

            <div class="form-group">
              <label for="cvv">CVV:</label>
              <input
                type="text"
                id="cvv"
                name="cvv"
                required
                pattern="[0-9]{3,4}"
                placeholder="123"
              />
            </div>
          </fieldset>

          <div class="checkout-summary">
            <h3>Order Summary</h3>
            <div id="checkoutItems"></div>
            <p class="checkout-total">
              Total: <span id="checkoutTotal">$0.00</span>
            </p>
          </div>

          <button type="submit" class="checkout-btn">Place Order</button>
        </form>
      </section>
    </main>

    <footer id="main-footer"></footer>

    <script type="module" src="/js/checkout.js"></script>
  </body>
</html>
